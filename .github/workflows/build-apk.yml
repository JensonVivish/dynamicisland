name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Cache Gradle home + wrapper + caches so subsequent runs skip downloads
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Cache Android SDK build-tools / platforms
      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-bt-34
          restore-keys: android-sdk-bt-

      # Cache the signing keystore so signature stays stable
      - name: Cache keystore
        id: cache-ks
        uses: actions/cache@v4
        with:
          path: keystore/
          key: digiisland-keystore-v1

      - name: Generate keystore (first run only)
        if: steps.cache-ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkey -v \
            -keystore keystore/ci.jks \
            -alias digiisland \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass digiisland \
            -keypass digiisland \
            -dname "CN=DigiIsland,O=DigiforgeDynamics,C=IN"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: digiisland
          KEY_ALIAS: digiisland
          KEY_PASSWORD: digiisland
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true"
        run: |
          gradle assembleRelease \
            --no-daemon \
            --parallel \
            --build-cache \
            --configuration-cache \
            --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DigiIsland-v1.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DigiIsland-APK
          path: dist/DigiIsland-v1.1.apk
