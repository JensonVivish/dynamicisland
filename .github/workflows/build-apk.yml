name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ── Keystore ──────────────────────────────────────────────────────────
      # The keystore is cached so the APK signature stays the same across builds.
      # On the very first run it is generated fresh and then saved to the cache.
      - name: Restore cached keystore
        id: cache-ks
        uses: actions/cache@v4
        with:
          path: keystore/
          key: digiisland-keystore-v1

      - name: Generate keystore (first run only)
        if: steps.cache-ks.outputs.cache-hit != 'true'
        run: |
          mkdir -p keystore
          keytool -genkey -v \
            -keystore keystore/ci.jks \
            -alias digiisland \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass digiisland \
            -keypass digiisland \
            -dname "CN=DigiIsland,O=DigiforgeDynamics,C=IN"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: digiisland
          KEY_ALIAS: digiisland
          KEY_PASSWORD: digiisland
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/DigiIsland-v1.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DigiIsland-APK
          path: dist/DigiIsland-v1.1.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DigiIsland-v1.1.apk
