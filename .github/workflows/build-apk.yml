```yaml
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: GitHub secret KEYSTORE_BASE64 is missing."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/keystore"

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/keystore/digiisland.jks"

          if [ ! -s "$RUNNER_TEMP/keystore/digiisland.jks" ]; then
            echo "ERROR: Keystore decoding failed."
            exit 1
          fi

          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/digiisland.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: DigiIsland-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
```
